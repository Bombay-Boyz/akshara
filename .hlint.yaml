# Section 5.2 ban-list. Each restriction names the specific
# module(s) the partial function lives in -- Data.List.NonEmpty.head
# is deliberately NOT banned: it is NonEmpty a -> a, total by
# construction, a different function that happens to share a name
# with the banned partial one.
- functions:
    - name: head
      within: []
      message: "use pattern matching, not partial head"
    - name: tail
      within: []
    - name: fromJust
      within: []
    - name: "!!"
      within: []
    - name: error
      within: []
    - name: undefined
      within: []
    - name: unsafePerformIO
      within: []
    - name: "Debug.Trace.trace"
      within: []
