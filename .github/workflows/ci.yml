name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.4'
          cabal-version: '3.14.1.1'

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: ${{ runner.os }}-cabal-

      - run: cabal update

      # Section 5.1: -Werror on for this project's own CI, deliberately
      # not the default a Hackage consumer builds with.
      - run: cabal build --flags=werror all
      - run: cabal test --flags=werror all

      # Section 5.6: reports numbers on every run. No stored-baseline
      # regression-threshold enforcement is wired yet.
      - run: cabal bench --flags=werror all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/", "app/", "bench/"]'
          fail-on: warning

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.4'
      # Explicit --installdir, not a guess at cabal's default
      # (confirmed locally to vary: ~/.cabal/bin on some configs,
      # ~/.local/bin on others). Version pinned per Section 2.12.
      - run: |
          mkdir -p "$HOME/bin"
          cabal install fourmolu-0.21.0.0 \
            --installdir="$HOME/bin" --install-method=copy --overwrite-policy=always
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Check formatting (Section 5.3)
        run: fourmolu --mode check $(find src test app bench -name '*.hs')

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.4'
      - run: |
          mkdir -p "$HOME/bin"
          cabal install weeder-2.11.0 \
            --installdir="$HOME/bin" --install-method=copy --overwrite-policy=always
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: cabal build --ghc-options="-fwrite-ide-info"
      - name: Run weeder (Section 1.11)
        run: weeder
